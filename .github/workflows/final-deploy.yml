name: Final Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: final-pages
  cancel-in-progress: true

jobs:
  validate-and-test:
    name: Validate, Lint, Test, Security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: HTML syntax validation
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          import sys
          class StrictParser(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=False)
                  self.errors = []
              def handle_error(self, message):
                  self.errors.append(message)
          parser = StrictParser()
          parser.feed(open("index.html", encoding="utf-8").read())
          if parser.errors:
              print(parser.errors, file=sys.stderr)
              raise SystemExit(1)
          print("HTML OK")
          PY

      - name: CSS syntax validation
        run: |
          python3 - <<'PY'
          import re
          css = re.search(r"<style>([\s\S]*?)</style>", open("index.html", encoding="utf-8").read())
          if not css:
              raise SystemExit("No style block found")
          text = css.group(1)
          if text.count("{") != text.count("}"):
              raise SystemExit("Unbalanced CSS braces")
          print("CSS OK")
          PY

      - name: JavaScript linting (parse checks)
        run: |
          node --input-type=module < auth.js
          python3 - <<'PY'
          import re
          import subprocess
          import tempfile
          text = open('index.html', encoding='utf-8').read()
          if 'innerHTML' in text:
              raise SystemExit('innerHTML usage detected in index.html')
          match = re.search(r'<script type="module">([\s\S]*?)</script>\s*</body>', text)
          if not match:
              raise SystemExit('No inline module script found in index.html')
          with tempfile.NamedTemporaryFile('w', suffix='.mjs', delete=False, encoding='utf-8') as handle:
              handle.write(match.group(1))
              script_path = handle.name
          subprocess.run(['node', '--check', script_path], check=True)
          print('JS lint checks OK')
          PY

      - name: Unit tests (Node)
        run: node --test auth.test.mjs

      - name: Integration tests (Python)
        run: |
          python test_tokenizers.py
          python test_security_web3.py

      - name: Security scan (static checks)
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          patterns = [r'AKIA[0-9A-Z]{16}', r'-----BEGIN (RSA|EC|OPENSSH) PRIVATE KEY-----']
          files = [p for p in Path('.').glob('*') if p.is_file()]
          for f in files:
              content = f.read_text(encoding='utf-8', errors='ignore')
              for pat in patterns:
                  if re.search(pat, content):
                      raise SystemExit(f'Secret-like pattern found in {f.name}')
          print('Security scan OK')
          PY

  build:
    name: Build Site
    runs-on: ubuntu-latest
    needs: validate-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build static site
        run: |
          mkdir -p site/docs
          cp index.html site/index.html
          cp auth.js site/auth.js
          cp wallet-core.js site/wallet-core.js
          cp bip39_wordlist.js site/bip39_wordlist.js
          cp mtk-nec-economy.js site/mtk-nec-economy.js
          cp layer7-math.js site/layer7-math.js
          cp justice-32-chapters.js site/justice-32-chapters.js
          cp rbac.js site/rbac.js
          cp ai-chat.js site/ai-chat.js
          cp README.md site/README.md
          cp DEPLOYMENT.md site/DEPLOYMENT.md
          cp SECURITY.md site/SECURITY.md
          cp OAUTH2-SETUP.md site/OAUTH2-SETUP.md
          cp TESTING.md site/TESTING.md
          cp docs/* site/docs/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  health-check:
    name: Health Check
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Check deployed URL
        run: |
          url='${{ needs.deploy.outputs.page_url }}'
          if [ -z "$url" ]; then
            echo "No deployment URL returned"
            exit 1
          fi
          curl --fail --show-error --retry 10 --retry-delay 6 "$url" | grep -i "auth"
          echo "Health check OK: $url"
