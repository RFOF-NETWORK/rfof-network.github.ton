name: Python Package

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: pip install -e .

      - name: Run CharTokenizer demo
        run: python3 char_tokenizer.py

      - name: Run BPETokenizer demo
        run: python3 bpe_tokenizer.py

      - name: Run import test
        run: |
          python3 -c "
          from multi_spark_tokenizer_python_paket import CharTokenizer, BPETokenizer

          # CharTokenizer test
          tok = CharTokenizer()
          ids = tok.encode('Hallo Welt!')
          assert tok.decode(ids) == 'Hallo Welt!', 'CharTokenizer encode/decode failed'
          print('CharTokenizer: OK')

          # BPETokenizer test
          bpe = BPETokenizer(anzahl_merges=10)
          bpe.trainieren('python python python lernen lernen')
          tokens = bpe.tokenisieren('python')
          assert isinstance(tokens, list) and len(tokens) > 0, 'BPETokenizer failed'
          print('BPETokenizer: OK')

          print('Alle Tests bestanden!')
          "

  build:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: pip install build

      - name: Build package
        run: python -m build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-package-dist
          path: dist/
