name: Deploy Docs and Demo to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate-and-test:
    name: Validate & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate HTML syntax
        run: |
          python3 - <<'EOF'
          from html.parser import HTMLParser
          import sys

          class StrictParser(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=False)
                  self.errors = []
              def handle_error(self, message):
                  self.errors.append(message)

          parser = StrictParser()
          with open("index.html", encoding="utf-8") as f:
              parser.feed(f.read())
          if parser.errors:
              print("HTML errors:", parser.errors, file=sys.stderr)
              sys.exit(1)
          print("✅ index.html syntax OK")
          EOF

      - name: Validate JavaScript is parseable
        run: |
          node --input-type=module < auth.js
          python3 - <<'PY'
          import re
          import subprocess
          import tempfile
          text = open('index.html', encoding='utf-8').read()
          match = re.search(r'<script type="module">([\s\S]*?)</script>\s*</body>', text)
          if not match:
              raise SystemExit('No inline module script found in index.html')
          with tempfile.NamedTemporaryFile('w', suffix='.mjs', delete=False, encoding='utf-8') as handle:
              handle.write(match.group(1))
              script_path = handle.name
          subprocess.run(['node', '--check', script_path], check=True)
          print("✅ auth.js and inline module script parse OK")
          PY

      - name: Run auth unit tests
        run: node --test auth.test.mjs

      - name: Print test summary
        if: always()
        run: echo "### Auth Test Results" >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build Site
    runs-on: ubuntu-latest
    needs: validate-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build static site
        run: |
          mkdir -p site/docs
          cp index.html site/index.html
          cp auth.js site/auth.js
          cp README.md site/README.md
          cp DEPLOYMENT.md site/DEPLOYMENT.md
          cp SECURITY.md site/SECURITY.md
          cp docs/* site/docs/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
