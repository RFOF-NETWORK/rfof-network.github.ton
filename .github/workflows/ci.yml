name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tokenizer tests
        run: python test_tokenizers.py

      - name: Run security and web3 tests
        run: python test_security_web3.py

      - name: Success message
        if: success()
        run: echo "✅ Alle Tests wurden erfolgreich ausgefuehrt."

      - name: Failure message
        if: failure()
        run: echo "❌ Mindestens ein Test ist fehlgeschlagen."
